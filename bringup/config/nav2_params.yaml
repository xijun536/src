          obstacle_range: 30.0                                       # meters
          min_obstacle_height: -2.0                                  # default 0, meters
          max_obstacle_height: 2.0                                  # default 3, meters
          expected_update_rate: 0.0                                 # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0                              # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false                                       # default false, for laser scans
          filter: "voxel"                                           # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
          voxel_min_points: 0                                       # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true                                 # default false, clear the buffer after the layer gets readings from it
        livox_clear:
          enabled: true                                             # default true, can be toggled on/off with associated service call
          data_type: PointCloud2
          # topic: /cloud_registered
          topic: /terrain_map
          marking: false
          clearing: true
          max_z: 8.0                                                # default 10, meters
          min_z: -1.0                                                # default 0, meters
          vertical_fov_angle: 1.029                                 # 垂直视场角，单位为弧度，For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_padding: 0.05                                # 3D Lidar only. Default 0, in meters
          horizontal_fov_angle: 6.29                                # 3D 激光雷达水平视场角
          decay_acceleration: 5.0                                   # default 0, 1/s^2.
          model_type: 1                                             # 0=深度相机，1=3D激光雷达
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.8  # 0.4
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
    ros__parameters:
      use_sim_time: false
      expected_planner_frequency: 5.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_smac_planner/SmacPlanner2D"
        tolerance: 0.5
        allow_unknown: true
        downsample_costmap: false
        downsampling_factor: 1
        max_iterations: 1000000
        max_on_approach_iterations: 1000
        max_planning_time: 2.0
        cost_travel_multiplier: 4.0
        smooth_path: true
        smoother:
          max_iterations: 1000
          w_smooth: 0.5
          w_data: 0.15
          tolerance: 1.0e-10
          do_refinement: true

