behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 2.0
    # recovery_plugins: ["spin", "backup", "assisted_teleop", "wait"]
    recovery_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    robot_base_frame: base_frame
    transform_timeout: 0.1
    use_sim_time: True
    simulate_ahead_time: 10.0
    max_rotational_vel: 3.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0
    # param for BackUpTwzFree
    #robot_radius: 0.3
    #max_radius: 5.0
    #service_name: "global_costmap/get_costmap"
    #free_threshold: 6
    #visualization: True

