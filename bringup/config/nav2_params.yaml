    yaml_filename: ""

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [6.0, 6.0, 6.28]
    min_velocity: [-6.0, -6.0, -6.28]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [6.0, 6.0, 6.0]
    max_decel: [-6.0, -6.0, -6.0]
    odom_topic: "odometry"
    odom_duration: 0.1